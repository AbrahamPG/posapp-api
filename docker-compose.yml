services:
  postgres:
    image: postgres:16
    container_name: posapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: posapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - posbro_postgres_data:/var/lib/postgresql/data

volumes:
  posbro_postgres_data: